<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    FafnirGank Marketplace
  </title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <script
    src="https://kit.fontawesome.com/a2d9d6d66b.js"
    crossorigin="anonymous"
  ></script>

</head>

<body>

  <!-- Background Glow -->
  <div class="bg-glow"></div>

  <!-- =========================
       NAVBAR
  ========================== -->

  <nav class="navbar">

    <div class="logo">
      FAFNIRGANK MARKETPLACE
    </div>

    <div class="menu">

      <a href="#products">
        Produk
      </a>

      <a href="#store">
        Store
      </a>

      <a href="#contact">
        Contact
      </a>

    </div>

  </nav>

  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <div class="hero-content">

      <h1>
        Premium Digital
        &
        Physical Store
      </h1>

      <p>
        Fast Process • Trusted • Modern Cyber Experience
      </p>

      <button onclick="scrollToProducts()">
        Explore Products
      </button>

    </div>

  </section>

  <!-- =========================
       DIGITAL PRODUCTS
  ========================== -->

  <section
    id="products"
    class="products-section"
  >

    <div class="section-title">
      Produk Digital
    </div>

    <div
      id="product-list"
      class="product-grid"
    ></div>

  </section>

  <!-- =========================
       STORE PRODUCTS
  ========================== -->

  <section
    id="store"
    class="products-section"
  >

    <div class="section-title">
      Store Products
    </div>

    <div
      id="store-list"
      class="product-grid"
    ></div>

  </section>

  <!-- =========================
       CONTACT
  ========================== -->

  <section
    id="contact"
    class="products-section"
  >

    <div class="section-title">
      Contact
    </div>

    <div class="contact-box">

      <p>
        Hubungi admin untuk informasi lebih lanjut.
      </p>

      <a
        href="https://wa.me/6285921967820"
        target="_blank"
        class="contact-btn"
      >
        <i class="fab fa-whatsapp"></i>

        WhatsApp Admin
      </a>

    </div>

  </section>

  <!-- =========================
       MODAL
  ========================== -->

  <div
    id="productModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <!-- CLOSE -->
      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

      <!-- IMAGE -->
      <img
        id="modalImage"
        src=""
        alt="Preview Produk"
      >

      <!-- TITLE -->
      <h2 id="modalTitle"></h2>

      <!-- DESC -->
      <p id="modalDesc"></p>

      <!-- PRICE -->
      <div
        class="modal-price"
        id="modalPrice"
      ></div>

      <!-- PAYMENT -->
      <div class="payment-title">
        Metode Pembayaran
      </div>

      <!-- AUTO RENDER PAYMENT -->
      <div
        class="payment-list"
        id="paymentList"
      ></div>

      <!-- BUY BUTTON -->
      <button
        class="buy-btn"
        onclick="buyNow()"
      >
        <i class="fas fa-shopping-cart"></i>

        BELI SEKARANG
      </button>

    </div>

  </div>

  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    © 2026
    FafnirGank Marketplace

  </footer>

  <!-- CONFIG -->
  <script src="config.js"></script>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
